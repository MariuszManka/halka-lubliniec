name: Build and deploy to Firebase Hosting

on:
  push:
    branches:
      - firebase
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
      NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET }}
      NEXT_PUBLIC_SANITY_API_VERSION: ${{ vars.NEXT_PUBLIC_SANITY_API_VERSION }}
      SANITY_REQUIRED: "true"
      GOOGLE_CALENDAR_ICAL_URL: ${{ vars.GOOGLE_CALENDAR_ICAL_URL }}
      GOOGLE_CALENDAR_REQUIRED: ${{ vars.GOOGLE_CALENDAR_REQUIRED }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site with Sanity content
        run: npm run build

      - name: Deploy live site
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HALKA_LUBLINIEC }}
          channelId: live
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
